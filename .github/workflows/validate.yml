name: Validate

on:
push:
branches: [main]
pull_request:
branches: [main]

jobs:
validate:
runs-on: ubuntu-latest
steps:

uses: actions/checkout@v4

uses: pnpm/action-setup@v2
with:
version: 8

uses: actions/setup-node@v4
with:
node-version: 20
cache: 'pnpm'

run: pnpm install

run: pnpm run lint

run: pnpm run format:check

run: pnpm run type-check

run: pnpm run test
