packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  core-js: true
  esbuild: true
  prisma: true

nodeLinker: hoisted

overrides:
  '@types/react': 18.2.79
  '@types/react-dom': 18.2.25

allowedDeprecatedVersions:
  # Silencia avisos de subdependências que não controlamos
  '@humanwhocodes/config-array': '*'
  '@humanwhocodes/object-schema': '*'
  glob: '*'
  inflight: '*'
  rimraf: '*'
  sourcemap-codec: '*'
  uuid: '*'
  eslint: '8.57.1'
  next: '14.2.15'
  crypto: '1.0.1'
