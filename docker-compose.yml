version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: devlife-postgres
    environment:
      POSTGRES_USER: devlife
      POSTGRES_PASSWORD: devlife123
      POSTGRES_DB: devlife
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlife"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4
    container_name: devlife-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@devlife.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
volumes:
  postgres_data:
